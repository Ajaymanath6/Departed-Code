<!--semantic start-->
<div
  #containerRef
  (keydown)="move($event)"
  (click)="setFocusOnInput($event)"
  class="cust-trans focus-within:shadow-[0_2px_rgb(0,158,189)]- pr-[10rem]- container relative mb-1 flex min-h-[16px] w-full items-center justify-between rounded border-2 border-gray-300 bg-gray-50 p-4 text-sm text-Mdblue-700 focus-within:border-Mdblue-600"
>
  <div
    class="flex-1- flex-shrink-0- flex-nowrap- overflow-hidden- flex flex-wrap"
  >
    <app-chip
      class="inline-flex- flex"
      *ngFor="let chip of chips; let idx = index"
      #chipRefs
      [editable]="true"
      [closeable]="true"
      [chip]="chip"
      (chipOutSelect)="selectChipAtIndex(idx)"
      (chipOutEdit)="setChipEditingStatus($event)"
      (chipOutDelete)="deleteChip(idx)"
    ></app-chip>
    <input
      name="inputValue"
      [(ngModel)]="inputValue"
      #inputRef
      tabindex="0"
      (keydown.backspace)="selectChipAtIndex(chips.length - 1)"
      (keyup.enter)="insertChip()"
      (blur)="insertChip()"
      class="bg-transparent px-2 py-1 text-base font-normal outline-none placeholder:text-Mdblue-600"
      placeholder=""
      required
    />
  </div>
  <div
    class="top-[1rem]- absolute- bottom-[0]- right-[0.5rem]- top-[0]- flex items-center"
  >
    <span class="mr-2 cursor-pointer text-base font-semibold text-primary-700"
      >Clear</span
    >
    <button
      type="submit"
      class="flex items-center rounded bg-primary-700 px-4 py-3 text-base font-medium text-white hover:bg-primary-800 focus:outline-none focus:ring-4 focus:ring-primary-300"
    >
      <span class="material-symbols-outlined mr-1"> search </span>
      <span>Search</span>
    </button>
  </div>
</div>
<div class="container- mb-4 mt-4">
