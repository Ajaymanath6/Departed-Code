<aside
  class="fixed left-0 top-0 z-[100] flex h-screen w-[11rem] flex-col border-r border-slate-200 bg-slate-50 shadow-md"
  aria-label="Page navigation"
>
  <div class="shrink-0 border-b border-slate-200 px-3 py-2">
    <p class="text-[13px] font-semibold text-slate-700">Pages</p>
  </div>
  <nav class="flex-1 overflow-y-auto px-2 py-2">
    <ul class="flex flex-col gap-0.5">
      <li *ngFor="let page of pages">
        <a
          [routerLink]="page.path"
          routerLinkActive="bg-slate-200 font-medium text-slate-900"
          class="block rounded px-2 py-1.5 text-[13px] text-slate-600 hover:bg-slate-100 hover:text-slate-900"
        >
          {{ page.label }}
        </a>
      </li>
    </ul>
  </nav>
</aside>
