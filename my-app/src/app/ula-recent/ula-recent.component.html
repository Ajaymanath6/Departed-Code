<!--recent chats start-->
<div class="mx-auto my-8 flex h-screen w-full max-w-7xl flex-col overflow-hidden rounded-xl border border-gray-300 bg-white">

  <!-- Header -->
  <div class="flex shrink-0 items-center justify-between gap-4 border-b border-gray-300 bg-white px-6 py-3 rounded-t-xl">
    <div class="flex items-end gap-4">
      <button type="button" aria-label="Toggle chat history"
        class="inline-flex items-center justify-center rounded-md p-0.5 text-Mdblue-700 hover:bg-gray-100 focus:outline-none">
        <img src="assets/ula/ula-grid-layout-side.svg" alt="" class="h-6 w-6" width="24" height="24" />
      </button>
      <div class="flex flex-col gap-0.5">
        <h1 class="text-lg font-semibold leading-[1.4] text-Mdblue-700">New Chat</h1>
      </div>
    </div>
    <div class="flex items-center justify-end gap-4">
      <button type="button"
        class="inline-flex items-center justify-center gap-1 rounded-md border-[1.5px] border-gray-400 bg-white px-2.5 py-2 text-base font-semibold text-gray-700 hover:bg-gray-50 focus:outline-none">
        <span class="material-symbols-outlined icon-18" aria-hidden="true">add</span>
        <span>New Chat</span>
      </button>
    </div>
  </div>

  <!-- Body: history + chat -->
  <div class="flex min-h-0 flex-1 overflow-hidden rounded-b-xl bg-white">

    <!-- Recent chats (left) -->
    <aside class="flex w-full max-w-[20rem] shrink-0 flex-col gap-4 border-r border-gray-300 bg-white p-4">
      <div class="flex flex-col gap-1">
        <p class="text-base font-semibold leading-[1.4] text-Mdblue-700">Recent Chats</p>
        <p class="text-sm font-normal leading-[1.4] text-gray-600">Recent chats for this Workspace</p>
      </div>

      <div class="flex flex-col gap-2">
        <div class="flex items-center rounded-md border border-gray-300 bg-white px-2.5 py-2 hover:border-purple-600 hover:bg-gray-50 focus-within:border-purple-600 focus-within:bg-white focus-within:ring-1 focus-within:ring-purple-600">
          <input type="search"
            class="min-w-0 flex-1 border-0 bg-transparent p-0 text-base font-normal text-Mdblue-700 placeholder:text-gray-700 focus:outline-none focus:ring-0"
            placeholder="Search Chats"
            aria-label="Search Chats" />
          <button type="button" aria-label="Search chats"
            class="inline-flex items-center justify-center rounded text-Mdblue-700 hover:text-purple-600 focus:outline-none focus:ring-2 focus:ring-purple-500">
            <span class="material-symbols-outlined icon-20" aria-hidden="true">search</span>
          </button>
        </div>

        <div class="flex flex-col gap-2 pt-2">
          <p class="w-full text-center text-sm font-normal leading-[1.4] text-gray-600">Today</p>
          <div class="flex flex-col gap-1 rounded-md">
            <button type="button"
              class="w-full rounded-md bg-gray-100 px-2 py-2 text-left text-sm font-bold leading-[1.4] text-Mdblue-700 hover:bg-gray-200 focus:outline-none">
              New Chat
            </button>
          </div>
        </div>
      </div>
    </aside>

    <!-- Main chat -->
    <section class="flex min-w-0 flex-1 flex-col bg-white">
      <div class="min-h-0 flex-1 overflow-y-auto px-8 pb-4 pt-6 sm:px-16">
        <!-- User message bubble -->
        <div class="mb-4 flex justify-end pe-0 sm:pe-8">
          <div class="rounded-tl-xl rounded-tr-xl rounded-bl-xl bg-purple-50 px-4 py-4">
            <p class="text-base font-normal leading-[1.4] text-Mdblue-700">Case Overview</p>
          </div>
        </div>

          <!-- ULA reply + case lookup -->
        <div class="flex flex-col gap-4 pe-0 sm:px-8">
          <p class="text-left text-base font-normal leading-[1.4] text-Mdblue-700">
            To pull the right case overview, tell me what you have on the case.<br />
            Pick one — or paste anything you know:
          </p>

          <div class="flex max-w-[26.8125rem] flex-col gap-2">
            <div class="flex flex-col gap-1">
              <label for="ula-case-number-link"
                class="text-left text-sm font-semibold leading-[1.4] text-Mdblue-700">
                Paste Case number or UniCourt case link here
              </label>
              <input id="ula-case-number-link" type="text"
                class="block w-full rounded-md border border-gray-300 bg-white px-2.5 py-2 text-left text-base font-normal leading-[1.4] text-Mdblue-700 placeholder:text-gray-700 hover:border-purple-600 hover:bg-gray-50 focus:border-purple-600 focus:outline-none focus:ring-1 focus:ring-purple-600"
                placeholder="Case Number/CaseLink"
                aria-label="Case Number or Case Link" />
            </div>

            <div class="text-left">
              <button type="button"
                class="inline-flex items-center justify-center rounded-md bg-purple-600 px-2.5 py-2 text-base font-semibold leading-[1.4] text-white hover:bg-purple-800 focus:outline-none focus:ring-2 focus:ring-purple-500">
                Continue
              </button>
            </div>
          </div>
        </div>
      </div>

      <!-- Composer -->
      <div class="shrink-0 border-t border-gray-300 bg-white pb-4">
        <div class="mx-auto flex w-full max-w-[53.75rem] flex-col gap-2 px-4 pt-4">
          <div class="flex w-full items-center gap-4 rounded-xl border-[1.5px] border-gray-300 bg-white p-4 hover:border-purple-600 hover:bg-gray-50 focus-within:border-purple-600 focus-within:bg-white focus-within:ring-1 focus-within:ring-purple-600">
            <input type="text"
              class="min-w-0 flex-1 border-0 bg-transparent p-0 text-sm font-normal leading-[1.4] text-Mdblue-700 placeholder:text-gray-700 focus:outline-none focus:ring-0"
              placeholder="Write a message"
              aria-label="Write a message" />
          </div>
          <p class="px-2 text-left text-[13px] font-normal leading-[1.1] text-gray-600">
            ULA is AI and can make mistakes. Verify responses before filing.
          </p>
        </div>
      </div>
    </section>
  </div>
</div>
<!--recent chats end-->
