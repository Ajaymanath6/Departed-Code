<!doctype html>
<html>
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Page Title</title>
        <link rel="stylesheet" href="style.css" />
    </head>

    <body>
        <h1 style="text-align: center; margin-bottom: 40px; text-decoration: underline">Echart</h1>

        <div class="d-none">
            <h2 style="text-align: center">1. Vertical Normal Bar</h2>
            <div id="container1" class="wh"></div>
        </div>
        <div class="d-none">
            <h2 style="text-align: center">2. Horizontal Normal Bar</h2>
            <div id="container3" class="wh"></div>
        </div>
        <div class="d-none">
            <h2 style="text-align: center">3. Vertical Stacked Bar</h2>
            <h4 style="text-align: center">case by filing date</h4>
            <div id="container4" class="wh"></div>
        </div>
        <div class="d-none">
            <h2 style="text-align: center">4. horizontal Stacked Bar</h2>
            <h4 style="text-align: center">case by filing date</h4>
            <div id="container8" class="wh"></div>
        </div>
        <div>
            <h2 style="text-align: center">5. Line Chart</h2>
            <div id="container2" class="wh"></div>
        </div>
        <div>
            <h2 style="text-align: center">6. Pie</h2>
            <h4 style="text-align: center">case by case type</h4>
            <div id="container5" class="wh"></div>
        </div>
        <div>
            <h2 style="text-align: center">7. Donut</h2>
            <div id="container6" class="wh"></div>
        </div>
        <div>
            <h2 style="text-align: center">8. Gauge Ring</h2>
            <div id="gaugeRing" class="wh"></div>
        </div>
        <div>
            <h2 style="text-align: center">9. Half Gauge</h2>
            <div id="halfgauge" class="wh"></div>
        </div>
        <div class="d-none">
            <h2 style="text-align: center">8. Map</h2>
            <div id="container7" class="wh"></div>
        </div>

        <!--map jquery start-->
        <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/jquery/dist/jquery.min.js"></script>
        <!--map jquery end-->

        <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/echarts@5.3.0/dist/echarts.min.js"></script>
        <script type="text/javascript" src="theme/Apollo-theme.js"></script>
        <script type="text/javascript" src="echart.js"></script>
    </body>
</html>
