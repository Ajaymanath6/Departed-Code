default:
  image: node:20-bookworm-slim
  tags:
    - gitlab-org-medium

variables:
  NPM_CONFIG_CACHE: "$CI_PROJECT_DIR/.npm"
  HOME: "$CI_PROJECT_DIR"

stages:
  - build
  - deploy

cache:
  key:
    files:
      - my-app/package-lock.json
  paths:
    - my-app/node_modules/
    - .npm/
  policy: pull-push

build_angular:
  stage: build
  script:
    - mkdir -p "$NPM_CONFIG_CACHE"
    - cd my-app
    - npm ci
    - npx @angular/cli@15.2.10 build --configuration production --base-href ./
  artifacts:
    expire_in: 1 week
    paths:
      - my-app/dist/my-app/
  rules:
    - if: '$CI_COMMIT_BRANCH == "flowbite-learning"'

pages:
  stage: deploy
  needs: [build_angular]
  before_script: []
  script:
    - rm -rf public
    - mkdir -p public
    - cp -r my-app/dist/my-app/* public/
    - cp public/index.html public/404.html
  artifacts:
    paths:
      - public
  rules:
    - if: '$CI_COMMIT_BRANCH == "flowbite-learning"'
