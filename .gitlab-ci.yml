image: node:20

variables:
  NPM_CONFIG_CACHE: "$CI_PROJECT_DIR/.npm"
  HOME: "$CI_PROJECT_DIR"

pages:
  cache:
    paths:
      - my-app/node_modules/
      - .npm/
  script:
    - mkdir -p public "$NPM_CONFIG_CACHE"
    - cd my-app
    - npm ci
    - npx @angular/cli build --configuration production --base-href ./
    - cp -r dist/my-app/* ../public
    - cp ../public/index.html ../public/404.html
  artifacts:
    paths:
      - public
  tags:
    - code_quality
  rules:
    - if: '$CI_COMMIT_BRANCH == "flowbite-learning"'
