default:
  # app_shared_runner / gitlab-org-medium job pods fail Kyverno (init-permissions runs as root).
  # code_quality runner starts without those pod policy violations on this cluster.
  image: node:20-bookworm-slim
  tags:
    - code_quality
  interruptible: true
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
      - scheduler_failure

variables:
  NPM_CONFIG_CACHE: "$CI_PROJECT_DIR/.npm"
  # Writable home for non-root job pods; avoids git .gitconfig lock errors during checkout.
  HOME: "/tmp"
  # Prevent parent NODE_PATH from leaking into npm/ng on shared runners.
  NODE_PATH: ""
  GIT_DEPTH: "1"

stages:
  - build
  - deploy

cache:
  key:
    files:
      - my-app/package-lock.json
  paths:
    - my-app/node_modules/
    - .npm/
  policy: pull-push

build_angular:
  stage: build
  timeout: 25m
  script:
    - mkdir -p "$NPM_CONFIG_CACHE"
    - unset NODE_PATH || true
    - test -f my-app/custom-webpack.config.js || (echo "Missing my-app/custom-webpack.config.js (required by angular.json)" && exit 1)
    - cd my-app
    - npm ci
    - npm run build -- --configuration production --base-href ./
  artifacts:
    expire_in: 1 week
    paths:
      - my-app/dist/my-app/
  rules:
    - if: '$CI_COMMIT_BRANCH == "flowbite-learning"'

pages:
  stage: deploy
  needs: [build_angular]
  timeout: 10m
  before_script: []
  script:
    - rm -rf public
    - mkdir -p public
    - cp -r my-app/dist/my-app/* public/
    - cp public/index.html public/404.html
  artifacts:
    paths:
      - public
  rules:
    - if: '$CI_COMMIT_BRANCH == "flowbite-learning"'
