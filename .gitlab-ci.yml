# node:20 runs as UID 1000 (node user), which aligns with restricted cluster policies.
image: node:20

variables:
  # Ensures npm cache and Angular output are writable when the runner enforces runAsNonRoot.
  NPM_CONFIG_CACHE: "$CI_PROJECT_DIR/.npm"
  HOME: "$CI_PROJECT_DIR"

pages:
  cache:
    paths:
      - my-app/node_modules/
      - .npm/
  script:
    - mkdir -p public "$NPM_CONFIG_CACHE"
    - cd my-app
    - npm ci
    - npx @angular/cli build --configuration production --base-href ./
    - cp -r dist/my-app/* ../public
    - cp ../public/index.html ../public/404.html
  artifacts:
    paths:
      - public
  tags:
    - app_shared_runner
  only:
    - flowbite-learning
